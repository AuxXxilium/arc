name: Build Arc Image

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "runs-on"
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
      version:
        description: "version (1.0.0)"
        required: true
        type: string
      stable:
        description: "stable"
        default: false
        type: boolean
      beta:
        description: "beta"
        default: false
        type: boolean
      docker:
        description: "push to Docker Hub"
        default: false
        type: boolean

jobs:
  build:
    runs-on: ${{ inputs.runs }}
    # Buildroot is built here, from nothing on a hosted runner.
    timeout-minutes: 360

    steps:
      # A self-hosted runner keeps work/ between runs, and with it the
      # buildroot tree build.sh only rebuilds what changed in.
      - name: Checkout
        uses: actions/checkout@main
        with:
          clean: ${{ inputs.runs != 'self-hosted' }}

      - name: Free Disk Space
        if: ${{ inputs.runs == 'ubuntu-latest' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Dependencies
        if: ${{ inputs.runs == 'ubuntu-latest' }}
        run: |
          git config --global user.email "info@auxxxilium.tech"
          git config --global user.name "AuxXxilium"
          sudo timedatectl set-timezone "Europe/Berlin"

          # What build.sh's check_tools asks for: buildroot, GRUB, the disk
          # and the release files.
          sudo apt update
          sudo apt install -y build-essential bc flex bison rsync patch cpio file perl wget \
            git curl jq unzip zip tar gzip zstd xz-utils lz4 bzip2 \
            libelf-dev libssl-dev qemu-utils fdisk dosfstools e2fsprogs \
            pkg-config gettext gawk python3 libfreetype6-dev unifont \
            zlib1g-dev liblzma-dev libdevmapper-dev

      # Buildroot's downloads and the GRUB build. Neither decides what is
      # built: build.sh checks both against what it needs.
      - name: Cache
        if: ${{ inputs.runs == 'ubuntu-latest' }}
        uses: actions/cache@v4
        with:
          path: |
            work/buildroot/.buildroot-dl
            work/grub-*
            work/grub.img.gz
            work/grub.fingerprint
          key: build-${{ github.run_id }}
          restore-keys: build-

      - name: Build
        env:
          AUX_TOKEN: ${{ secrets.BUILD_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          # One release repository per build: arc or arc-beta. --replace as
          # allowUpdates was.
          ARGS="--no-pull --release --replace"
          if ${{ inputs.stable }} && ${{ inputs.beta }}; then
            echo "::error::stable or beta, not both."
            exit 1
          elif ${{ inputs.stable }}; then
            ARGS="${ARGS} --stable"
          elif ${{ inputs.beta }}; then
            ARGS="${ARGS} --beta"
          else
            ARGS="${ARGS} --no-publish"
          fi
          echo "ARC_BRANCH=full" >>"${GITHUB_ENV}"
          echo "ARC_VERSION=${VERSION}" >>"${GITHUB_ENV}"

          ./build.sh ${ARGS}

      - name: Upload
        if: ${{ success() && !inputs.stable && !inputs.beta }}
        uses: actions/upload-artifact@v4
        with:
          name: arc-${{ inputs.version }}
          path: |
            arc-*.zip
            update-*.zip
            update-*.hash
          retention-days: 7

      # Build and push a qemux/qemu wrapper image with this release's
      # arc.img baked in, so `docker run` boots it with no manual
      # compose/volume setup. See docker.md for the details and the
      # manual (bind-mount) alternative.
      - name: Docker Login
        if: inputs.docker == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Tags
        if: inputs.docker == true
        run: |
          TAGS=("auxxxilium/arc:${ARC_BRANCH}-${ARC_VERSION}")
          if [ "${{ inputs.stable }}" = "true" ]; then
            TAGS+=("auxxxilium/arc:${ARC_VERSION}" "auxxxilium/arc:latest")
          fi
          {
            echo "DOCKER_TAGS<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Docker Build and Push
        if: inputs.docker == true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.DOCKER_TAGS }}
